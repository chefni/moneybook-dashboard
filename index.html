<!-- ═══════════════════════════════════════════════════════════════════
     家計簿（PWA，取代 Android App 的網頁版）
     2026-11-01 第一階段：可安裝、自動更新、即時資料、立即同步。
     2026-11-01 第二階段：分析頁整頁搬過來（各區預設收合＋摘要），計算改用 engine.js——
       App Rules.kt 的逐條移植（engine.test.js 守著），不再是舊儀表板的「簡化子集」。

     1. 無寫死家庭識別碼：登入後查 household_members 取 household_id；非成員只顯示提示。

     4. XSS：DB 字串一律 textContent，全檔不用 innerHTML。
     5. ?demo=1：不連 Supabase，用頁內合成資料渲染（部署前預覽用；資料皆虛構）。
     部署見 DEPLOY.md（白名單腳本 deploy.ps1）。⚠️ private\ 內含真實資料，絕不可部署。

<style>
  :root {
    --bg:#f5f6fa; --card:#fff; --ink:#2c3e50; --sub:#5b6a79;
    --accent:#0abde3; --red:#c6323c; --green:#0b7a5e;
    --line:#dfe4ea; --track:#f1f2f6; --soft:#eef7fb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#171b21; --card:#222a33; --ink:#e9eef3; --sub:#8fa1b3;
      --line:#39434f; --track:#2d3641; --soft:#1d2b35;
      --red:#ee5253; --green:#10ac84;
    }
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }   /* 免得 .picker 的 display:grid 蓋掉 hidden */
  body { font-family:"Noto Sans TC",system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:760px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
  h1 { font-size:21px; }
  select,button,input { font:inherit; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  button { cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border:none; }
  button.link { border:none; background:none; color:var(--accent); padding:4px 6px; font-size:13px; }
  .spacer { flex:1; }
  .card { background:var(--card); border-radius:14px; padding:18px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .muted { color:var(--sub); font-size:13px; }
  .warn { color:var(--red); font-size:13px; }
  .expense { color:var(--red); } .income { color:var(--green); }
  .center { max-width:420px; margin:80px auto; text-align:center; }
  .center .card { padding:32px 24px; }
  .err { color:var(--red); font-size:13px; min-height:18px; margin-top:10px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 10px; }
  .chip { border-radius:999px; padding:5px 13px; font-size:13px; }
  .chip.active { background:var(--accent); border-color:var(--accent); color:#fff; }
  .badge { background:var(--accent); color:#fff; border-radius:6px; padding:3px 8px; font-size:12px; }

  /* 期間列：◀ 標題 ▶，點標題開選單（同 App PeriodBar） */
  .period { display:flex; align-items:center; justify-content:space-between; }
  .period .nav { border:none; background:none; font-size:18px; padding:6px 14px; }
  .period .nav:disabled { opacity:.3; cursor:default; }
  .period .title { border:none; background:none; text-align:center; padding:2px 8px; }
  .period .title b { display:block; font-size:18px; }
  .picker { margin:8px 0; display:grid; gap:10px; }
  .picker .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  /* 摺疊區塊（同 App FoldSection）：整條標題列可點，收合時看得到一句摘要 */
  .fold { background:var(--card); border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-top:10px; overflow:hidden; }
  .fold > .head { display:block; width:100%; text-align:left; border:none; border-radius:0; background:none; padding:12px 16px; }
  .fold > .head .t { display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; }
  .fold > .head .t span:first-child { flex:1; }
  .fold > .head .tog { color:var(--accent); font-size:12px; font-weight:400; }
  .fold > .head .sum { color:var(--sub); font-size:13px; margin-top:2px; }
  .fold > .body { padding:0 16px 14px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; gap:8px; padding:6px 0; font-size:14px; }
  .row b { font-size:16px; }
  .hr { border-top:1px solid var(--line); margin:2px 0; }
  .note { color:var(--sub); font-size:12px; margin:2px 0 8px; }

  /* 長條（同 App StatBar）：點了在下方展開逐筆 */
  .sbar { padding:4px 0; cursor:pointer; }
  .sbar .lbl { display:flex; justify-content:space-between; gap:8px; font-size:14px; }
  .sbar .lbl span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .track { height:12px; border-radius:6px; background:var(--track); overflow:hidden; margin-top:3px; }
  .track > div { height:100%; border-radius:6px; background:linear-gradient(90deg,#0abde3,#54a0ff); }
  .track.inc > div { background:linear-gradient(90deg,#0b7a5e,#1dd1a1); }
  .track.over > div { background:var(--red); }
  .detail { margin:4px 0 8px 8px; padding:6px 10px; border-radius:8px; background:var(--soft); font-size:12px; }
  .detail .r { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
  .detail .r span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .detail .tot { border-top:1px solid var(--line); margin-top:4px; padding-top:4px; color:var(--sub); }

  /* 分類變化表（分類｜本期｜較前期） */
  .mv { display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:2px 12px; font-size:13px; align-items:baseline; }
  .mv .h { color:var(--sub); font-size:12px; }
  .mv .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mv .a { text-align:right; }

  .srcrow { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .srccard { flex:0 0 auto; text-align:left; padding:10px 12px; border-radius:12px; }
  .srccard.on { background:var(--soft); border-color:var(--accent); }
  .srccard small { display:block; color:var(--sub); font-size:12px; }
  .srccard b { font-size:15px; }
  .tabs { display:flex; gap:6px; margin-bottom:8px; }
  canvas { max-height:280px; }
  .sub { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .sub .m { flex:1; min-width:0; }
  .exrow { display:flex; gap:10px; align-items:baseline; padding:5px 0; font-size:13px; color:var(--sub); border-bottom:1px dashed var(--line); }
  .exrow .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .exrow .r { border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:11px; }
  .exrow .a { text-decoration:line-through; }
  footer { margin:18px 0 8px; color:var(--sub); font-size:12px; }
  @media (max-width:420px) {
    body { padding:12px; }
    header { gap:8px; }
    h1 { font-size:19px; }
  }
</style>

<script>
"use strict";
/* ═══════════ 基本設定 ═══════════ */
// Supabase publishable key 出現在原始碼是官方設計（安全靠 RLS），不是洩漏。
const SUPABASE_URL = "https://zdfhieekhaaqfarqpslc.supabase.co";
const SUPABASE_KEY = "sb_publishable_jIw3eJ0CW-rmGL7b9Wh3XQ_cQMDIegf";
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const nt = n => "NT$ " + Math.round(Number(n) || 0).toLocaleString("en-US");
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(parent, ...kids){ for (const k of kids) if (k) parent.appendChild(k); return parent; }

/* ═══════════ 狀態 ═══════════ */
let E;                       // engine.js（defer 載入後才有）
let sb = null, hid = null;
let sel = null;              // 成員篩選：null＝全家合併
let period = null;
const S = {                  // 不隨期間變的設定類資料
  members: [], accounts: [], catRules: [], labels: [], excludeRules: [], filterRules: [], cats: [], subIgnores: new Set()
};
const periodCache = new Map();   // 期間 key → { txs, prevTxs, range6, acctTxnsWide }
const openSec = new Map();       // 各區開合狀態（換期間不會被洗回收合，同 App v93）
const ui = { chart: 0, cardSrc: null, bars: new Set() };
let charts = [];

/* ═══════════ 畫面切換 ═══════════ */
const VIEWS = ["status", "login", "nomember", "errorBox", "app"];
function showView(name){ for (const v of VIEWS) $(v).hidden = (v !== name); }
function showStatus(msg){ $("statusMsg").textContent = msg; showView("status"); }
function showError(msg){ $("errorMsg").textContent = msg; showView("errorBox"); }

/* ═══════════ 資料載入（同 App AnalysisScreen：本期、前期、近 6 月、存款流水寬窗 ±5 天） ═══════════ */
async function pagedFetch(mk){
  // ⚠️ 伺服器每次最多回 1000 列：一定要分頁。App 的 limit(5000) 只拿到 1000 列，
  //    近 6 月趨勢與訂閱偵測因此少算（2026-11-01 對照實測抓到）——網頁版不重蹈。
  let out = [];
  for (let page = 0; ; page++){
    const { data, error } = await mk().range(page * 1000, page * 1000 + 999);
    if (error) throw error;
    out = out.concat(data || []);
    if (!data || data.length < 1000) return out;
  }
}
async function selAll(table, order){
  const q = sb.from(table).select("*").eq("household_id", hid);
  const { data, error } = await (order ? q.order(order) : q);
  if (error) throw error;
  return data || [];
}
async function loadStatic(){
  const [members, accounts, catRules, labels, excludeRules, filterRules, cats, ign] = await Promise.all([
    selAll("members", "sort_order"), selAll("asset_accounts", "sort_order"), selAll("category_rules"),
    selAll("category_labels", "sort_order"), selAll("exclude_rules"), selAll("filter_rules"),
    selAll("categories", "sort_order"), selAll("subscription_ignores").catch(() => [])
  ]);
  Object.assign(S, { members, accounts, catRules: E.sortCategoryRules(catRules), labels, excludeRules,
                     filterRules, cats, subIgnores: new Set(ign.map(r => r.pattern)) });
}
const txRange = (a, b) => pagedFetch(() => sb.from("transactions").select("*")
  .eq("household_id", hid).eq("dedup_status", "unique")
  .gte("occurred_at", a).lt("occurred_at", b).order("occurred_at", { ascending: false }))
  .then(rows => rows.filter(t => t.occurred_at >= a && t.occurred_at < b));   // 客戶端再夾一次邊界

function addDays(t, n){ return new Date(Date.parse(t + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10); }
const periodKey = p => JSON.stringify(p);

async function loadPeriod(p){
  const key = periodKey(p);
  if (periodCache.has(key)) return periodCache.get(key);
  const P = E.Period, pv = P.prev(p), an = P.anchorMonth(p);
  const [y5, m5] = E.ymAdd(an.y, an.m, -5), [y1, m1] = E.ymAdd(an.y, an.m, 1);
  const ids = S.accounts.map(a => a.id);
  const ws = addDays(P.startDate(p), -5), we = addDays(P.endExclusive(p), 5);
  const [txs, prevTxs, range6, acctTxnsWide] = await Promise.all([
    txRange(P.startDate(p), P.endExclusive(p)),
    txRange(P.startDate(pv), P.endExclusive(pv)),
    txRange(`${y5}-${pad(m5)}-01`, `${y1}-${pad(m1)}-01`),
    ids.length ? pagedFetch(() => sb.from("account_transactions").select("*").in("account_id", ids)
      .gte("occurred_at", ws).lt("occurred_at", we).order("occurred_at", { ascending: false })) : []
  ]);
  const d = { txs, prevTxs, range6, acctTxnsWide };
  periodCache.set(key, d);
  return d;
}

/* ═══════════ 繪製 ═══════════ */
async function render(quiet){
  try {
    if (!quiet) showStatus("讀取資料中…");
    const d = DEMO ? demoPeriod(period) : await loadPeriod(period);
    showView("app");
    paint(d);
  } catch (e){
    console.error(e);
    if (quiet) console.warn("背景更新失敗，畫面保留上一份", e);
    else showError("讀取資料失敗：" + (e && e.message ? e.message : e));
  }
}

function paintPeriodBar(){
  $("periodLabel").textContent = E.Period.label(period);
  $("btnNext").disabled = !E.Period.canNext(period);
}
function buildChips(){
  const box = $("chips");
  box.replaceChildren();
  const mk = (label, val) => {
    const b = el("button", "chip" + (sel === val ? " active" : ""), label);
    b.addEventListener("click", () => { sel = val; buildChips(); render(true); });
    box.appendChild(b);
  };
  mk("👨‍👩‍👧 合併", null);
  for (const m of S.members) mk(m.nickname || m.name || "成員", m.id);
}

/** 一個摺疊區塊；body 是函式＝收合時不組裝（同 App：收著就不畫） */
function fold(key, title, summary, body){
  const box = el("section", "fold");
  const open = openSec.get(key) === true;
  const head = el("button", "head");
  head.setAttribute("aria-expanded", String(open));
  const t = add(el("div", "t"), el("span", null, title), el("span", "tog", open ? "收合 ▴" : "展開 ▾"));
  add(head, t, summary ? el("div", "sum", summary) : null);
  head.addEventListener("click", () => { openSec.set(key, !open); repaint(); });
  box.appendChild(head);
  if (open){ const b = el("div", "body"); body(b); box.appendChild(b); }
  return box;
}
function row(label, value, cls){
  return add(el("div", "row"), el("span", null, label), el("b", cls || null, value));
}
function sbar(label, amount, max, total, opts = {}){
  const w = el("div", "sbar");
  add(w, add(el("div", "lbl"), el("span", null, label),
             el("span", null, nt(amount) + (total > 0 ? ` · ${Math.trunc(amount * 100 / total)}%` : ""))));
  const tr = el("div", "track" + (opts.cls ? " " + opts.cls : ""));
  const fill = el("div");
  fill.style.width = (max > 0 ? Math.min(1, Math.max(0.02, amount / max)) : 0.02) * 100 + "%";
  w.appendChild(add(tr, fill));
  if (opts.onClick){ w.setAttribute("role", "button"); w.tabIndex = 0; w.addEventListener("click", opts.onClick); }
  return w;
}
/** 展開的逐筆（同 App SourceDetail） */
function detail(rows, total, nameOf = t => t.merchant || t.note || "（無商家）", dateOf = t => t.occurred_at){
  const box = el("div", "detail");
  for (const t of rows.slice().sort((a, b) => (dateOf(a) < dateOf(b) ? 1 : -1)))
    add(box, add(el("div", "r"), el("span", null, `${dateOf(t).slice(5)}  ${nameOf(t)}`), el("span", null, nt(t.amount))));
  add(box, add(el("div", "r tot"), el("span", null, `共 ${rows.length} 筆`), el("span", null, nt(total))));
  return box;
}
function toggleBar(key){ ui.bars.has(key) ? ui.bars.delete(key) : ui.bars.add(key); repaint(); }

let lastData = null;
function repaint(){ if (lastData) paint(lastData); }

function paint(d){
  lastData = d;
  paintPeriodBar();
  for (const c of charts) c.destroy();
  charts = [];
  const r = E.analyze({ ...S, ...d }, period, sel);
  const L = k => E.labelOf(k, S.labels);
  const root = $("sections");
  root.replaceChildren();
  if (!r.exp.length && !r.income.length && !d.txs.length){
    root.appendChild(add(el("div", "card"), el("p", "muted", "本期尚無資料")));
    return;
  }
  const { te, prevTe, ti } = r;

  // ── 本期收支 ──
  root.appendChild(fold("sum", "本期收支",
    prevTe > 0 ? `💬 這期共花 ${nt(te)}，比上期${te >= prevTe ? "多" : "少"}花 ${nt(Math.abs(te - prevTe))}` : `💬 這期共花 ${nt(te)}`,
    b => {
      add(b, row("支出", nt(te), "expense"));
      if (prevTe > 0){
        const diff = te - prevTe, sg = diff >= 0 ? "+" : "−";
        add(b, el("p", "note " + (diff > 0 ? "expense" : "income"),
          `較前一期 ${sg}${nt(Math.abs(diff))}（${sg}${Math.trunc(Math.abs(diff) * 100 / prevTe)}%）`));
      }
      add(b, row("收入（全部來源）", nt(ti), "income"), el("div", "hr"),
        row(ti - te >= 0 ? "結餘（收入−支出）" : "透支（支出＞收入）",

        for (const s of r.subs){

/* ═══════════ 即時更新 ═══════════ */
// 資料有變才重抓：比對「最新一筆交易的建立時間＋雲端最後撈取／同步完成時間」。
// 畫面開著每分鐘看一次；從背景切回來時直接整份重抓（App 上改分類這種不會動到上述時間的也一併跟上）。
const LIVE_EVERY = 60_000;
let liveMark = null, refreshing = false;

async function dataMark(){
  const one = q => q.limit(1).then(({ data, error }) => { if (error) throw error; return data && data[0]; });
  const [t, s, r] = await Promise.all([
    one(sb.from("transactions").select("created_at").eq("household_id", hid).order("created_at", { ascending: false })),
    one(sb.from("ingest_settings").select("last_run_at").eq("household_id", hid)),
    one(sb.from("sync_requests").select("finished_at").eq("household_id", hid).eq("status", "done")
          .order("finished_at", { ascending: false }))
  ]);
  return [t?.created_at, s?.last_run_at, r?.finished_at].join("|");
}
async function refreshData(){
  if (refreshing || $("app").hidden) return;
  refreshing = true;
  try {
    await loadStatic();
    periodCache.clear();
    buildChips();
    await render(true);
    liveMark = await dataMark();
  } catch (e){ console.warn("背景更新失敗，下次再試", e); }
  finally { refreshing = false; }
}
async function checkLive(){
  if (document.hidden || refreshing) return;
  try {
    const mark = await dataMark();
    if (liveMark !== null && mark !== liveMark) await refreshData();
    else liveMark = mark;
  } catch (e){ console.warn("檢查更新失敗", e); }
}
// 頁面本身有新版（伺服器上的 index.html 換了）→ 切回來時自動重新載入，等於 App 自動更新
let pageTag = null;
async function pageVersion(){
  const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
  return res.headers.get("etag") || res.headers.get("last-modified");
}
function startLiveUpdates(){
  liveMark = null;
  checkLive();
  setInterval(checkLive, LIVE_EVERY);
  pageVersion().then(v => { pageTag = v; }).catch(() => {});
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) return;
    try {
      const v = await pageVersion();
      if (pageTag && v && v !== pageTag && !syncing){ location.reload(); return; }
    } catch (_){ /* 離線：照用目前這版 */ }
    refreshData();
  });
}

/* ═══════════ 立即同步（同 App：寫 sync_requests → 雲端撈信 → 輪詢到完成） ═══════════ */
// DB 端有兩道防連點（60 秒節流、同家庭只允許一筆進行中）；錯誤翻成白話，不把 SQL 訊息丟給使用者。
let syncing = false;
function hhmm(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
async function showLastSync(prefix = ""){
  const { data } = await sb.from("ingest_settings").select("last_run_at, last_error").eq("household_id", hid).limit(1);
  const s = data && data[0];
  const { data: done } = await sb.from("sync_requests").select("finished_at")
    .eq("household_id", hid).eq("status", "done").order("finished_at", { ascending: false }).limit(1);
  const last = [s?.last_run_at, done?.[0]?.finished_at].filter(Boolean).sort().pop();
  $("syncMsg").textContent = prefix + (last ? `上次同步 ${hhmm(last)}` : "") +
                             (s?.last_error ? "　⚠️ 上次撈取有錯誤，請到 App 的同步頁查看" : "");
}
async function watchSync(id){
  syncing = true;
  $("btnSync").disabled = true;
  let st = "pending";
  for (let i = 0; i < 360 && st !== "done" && st !== "failed"; i++){   // 上限 30 分鐘
    await new Promise(r => setTimeout(r, 5000));
    const { data } = await sb.from("sync_requests").select("status").eq("id", id).limit(1);
    st = data?.[0]?.status || st;
  }
  syncing = false;
  $("btnSync").disabled = false;
  if (st === "done"){ await refreshData(); await showLastSync("✅ 同步完成，畫面已更新　"); }
  else if (st === "failed") $("syncMsg").textContent = "❌ 這次撈取失敗了；資料沒有遺失，下次同步會重撈同一段時間";
  else $("syncMsg").textContent = "⚠️ 同步逾時（超過 30 分鐘），請稍後再試";
}
async function startSync(){
  if (syncing) return;
  $("syncMsg").textContent = "同步中…已送出，雲端撈取中（約 1～3 分鐘）";
  const { data, error } = await sb.from("sync_requests").insert({ household_id: hid }).select("id").single();
  if (error || !data){
    const m = (error && error.message) || "";
    $("syncMsg").textContent = m.includes("過於頻繁") ? "⏳ 剛剛才同步過，請等約一分鐘再按"
      : (m.includes("uniq_sync_pending") || m.includes("duplicate key")) ? "⏳ 已有一次同步在進行中，完成後畫面會自己更新"
      : "❌ 送出失敗，請確認網路後再試";
    return;
  }
  watchSync(data.id);
}
async function initSync(){
  $("btnSync").hidden = false;
  $("btnSync").addEventListener("click", startSync);
  // 別的裝置（或 App）按了同步還沒跑完 → 接著等，完成時一樣自動更新
  const since = new Date(Date.now() - 30 * 60_000).toISOString();
  const { data } = await sb.from("sync_requests").select("id").eq("household_id", hid)
    .not("status", "in", "(done,failed)").gte("requested_at", since)
    .order("requested_at", { ascending: false }).limit(1);
  if (data && data.length){ $("syncMsg").textContent = "同步中…雲端撈取尚未完成"; watchSync(data[0].id); }
  else await showLastSync();
}

    if (k === 0){ T(9, 1990, "UNIQLO 信義店", "m2", "income", "[email] 示範銀行卡(媽媽)"); T(16, 30000, "普買 0050", "m1", "invest"); }
    acct.push({ id: "s" + (++n), account_id: "a1", occurred_at: day(5), amount: 68000, description: "薪資", note: "" });
    acct.push({ id: "w" + (++n), account_id: "a1", occurred_at: day(6), amount: -20000, description: "網銀轉出", note: "" });

async function afterLogin(session){
  try {
    $("who").textContent = "登入：" + (session.user.email || "");
    $("btnSignOut").hidden = false;
    showStatus("確認家庭成員資格中…");
    const { data: hm, error } = await sb.from("household_members").select("household_id").limit(1);
    if (error) throw error;
    if (!hm || !hm.length){ showView("nomember"); return; }
    hid = hm[0].household_id;
    showStatus("讀取設定中…");
    await loadStatic();
    buildChips();
    await render();
    startLiveUpdates();
    initSync().catch(e => console.warn("同步狀態讀取失敗", e));
  } catch (e){
    console.error(e);
    showError("初始化失敗：" + (e && e.message ? e.message : e));
  }
}
function startLive(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $("btnGoogle").addEventListener("click", async () => {
    $("loginErr").textContent = "";
    const { error } = await sb.auth.signInWithOAuth({ provider: "google",
      options: { redirectTo: location.origin + location.pathname } });
    if (error) $("loginErr").textContent = error.message;
  });
  const doSignOut = async () => { await sb.auth.signOut(); location.reload(); };
  $("btnSignOut").addEventListener("click", doSignOut);
  $("btnSignOut2").addEventListener("click", doSignOut);
  let started = false;
  sb.auth.onAuthStateChange((_ev, session) => { if (session && !started){ started = true; afterLogin(session); } });
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session){ if (!started){ started = true; afterLogin(session); } }
    else if (!started) showView("login");
  });
}

document.addEventListener("DOMContentLoaded", boot);   // defer 的 engine.js／chart.js 保證已先執行完
function boot(){
  E = window.Engine;
  if (!E){ showError("無法載入計算模組（engine.js），請重新整理。"); return; }
  period = thisMonth();
  bindNav();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (DEMO){
    buildDemo();
    $("demoBadge").hidden = false;
    buildChips();
    render();
    return;
  }
  showStatus("載入中…");
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.min.js";
  s.integrity = "sha384-H9dj4GG/hgfwNjlYa740FF9geXbzyXSgepgoobvIAW49UUAcfk+GAiBnLDIs4hRh";
  s.crossOrigin = "anonymous";
  s.onload = startLive;
  s.onerror = () => showError("無法載入 Supabase 程式庫，請檢查網路連線。");
  document.head.appendChild(s);
}
