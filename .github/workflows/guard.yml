name: 公開內容守門

# 這是 public repo（Pages 免費方案必須公開）。白名單以外的檔案一律紅燈——
# 防的是「一次 cp *.html 把 snapshot.html（真實家庭財務快照）推上網」這種不可逆事故。
on: [push, pull_request]

permissions:
  contents: read

jobs:
  whitelist:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      - name: 只允許兩個頁面＋對帳自測＋PWA 外殼＋記帳規則引擎＋明細/帳戶/我的畫面程式
        run: |
          bad=$(git ls-files | grep -vE '^(index|billbook)\.html$|^\.nojekyll$|^(selftest|sw|engine|engine\.test|classify_data|detail|accounts|demo|me)\.js$|^manifest\.webmanifest$|^icon-(192|512|maskable-512)\.png$|^\.github/workflows/guard\.yml$' || true)
          if [ -n "$bad" ]; then
            echo "::error::出現白名單以外的檔案，可能外洩私人資料："
            echo "$bad"
            exit 1
          fi
          echo "✅ 檔案清單符合白名單"
      # 與 deploy.ps1 同一組樣式、不分大小寫（-i）。用 --include 而不是 *.js 這種 glob：
      # glob 沒展開時 grep 會回 exit 2，被 if 當成「沒找到」而無聲通過。
      - name: 掃機密字串
        run: |
          pat='service_role|sb_secret|sbp_|(^|[^a-z_])(app|pdf)_password|ghp_|github_pat_|sk-ant-|GOCSPX-|BEGIN [A-Z ]*PRIVATE KEY|eyJ[A-Za-z0-9_-]{15,}\.eyJ|postgres(ql)?://[^ ]+:[^ ]+@|@(gmail|hotmail|outlook|yahoo)\.|tmu\.edu\.tw|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          set +e
          # -l＝只列檔名：公開 repo 的 CI 紀錄誰都看得到，命中的那一行（可能就是機密本身）不能印出來
          grep -rEli --include='*.html' --include='*.js' --include='*.webmanifest' --exclude-dir=.git "$pat" .
          rc=$?
          set -e
          if [ $rc -eq 0 ]; then echo "::error::偵測到疑似機密字串"; exit 1; fi
          if [ $rc -ne 1 ]; then echo "::error::掃描本身失敗（grep exit $rc）"; exit 1; fi
          echo "✅ 無機密字串"
      - name: 單檔大小上限（頁面暴增多半是有人把資料貼進去）
        run: |
          big=$(find . -path ./.git -prune -o -type f \( -name '*.html' -o -name '*.js' \) -size +200k -print)
          if [ -n "$big" ]; then echo "::error::檔案超過 200KB：$big"; exit 1; fi
          echo "✅ 大小正常"
      # 對帳演算法會「算錯而不報錯」（少加一列＝假差額，多加一列＝把不符顯示成相符），
      # 是這兩頁唯一無法靠肉眼看出來的邏輯。跑頁內那一份 recon()，不另外複製演算法。
      - name: 對帳演算法自測
        run: node selftest.js billbook.html
      # 家計簿的記帳規則（App Rules.kt 的移植）：算錯同樣不會報錯，只會讓總支出／總收入悄悄變成錯的數字
      - name: 記帳規則引擎測試
        run: node engine.test.js
