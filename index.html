<style>
  :root {
    --bg:#f5f6fa; --card:#fff; --ink:#2c3e50; --sub:#5b6a79;
    --accent:#0abde3; --red:#c6323c; --green:#0b7a5e;
    /* --accent 當文字或白字底色只有 2.2:1，戶外看不見；文字與選中態一律用 --accent-ink（5.6:1），同 billbook */
    --accent-ink:#0b7285;
    --accent-fill:#0b7285;   /* 白字的底色（按鈕、選中、徽章）：深淺色模式都用深色，白字才看得清 */

  }
  @media (prefers-color-scheme: dark) {

      --bg:#171b21; --card:#222a33; --ink:#e9eef3; --sub:#8fa1b3;
      --line:#39434f; --track:#2d3641; --soft:#1d2b35;

    }
  }
  * { box-sizing:border-box; margin:0; }
  [hidden] { display:none !important; }   /* 免得 .picker 的 display:grid 蓋掉 hidden */
  body { font-family:"Noto Sans TC",system-ui,sans-serif; background:var(--bg); color:var(--ink); padding:16px; max-width:760px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }

  /* 期間列：◀ 標題 ▶，點標題開選單（同 App PeriodBar） */

  /* 摺疊區塊（同 App FoldSection）：整條標題列可點，收合時看得到一句摘要 */

  /* 分類變化表（分類｜本期｜較前期） */

  .tabs { display:flex; gap:6px; margin-bottom:8px; }

  .cwrap canvas { max-height:280px; }

  .sub { display:flex; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .sub .m { flex:1; min-width:0; }

  .exrow .a { text-decoration:line-through; }
  /* ✈️ 旅遊 */
  .trip { border-bottom:1px solid var(--line); padding:6px 0 8px; }
  .trip > button:not(.triphead):not(.link) { margin:6px 0 2px; }

  .triphead .m, .txrow .m { flex:1; min-width:0; display:flex; flex-direction:column; }
  .triphead small, .txrow small { color:var(--sub); font-size:12px; }

  .txrow small.hint { color:var(--accent-ink); }
  .link.danger { color:var(--red); }
  .dlg { margin:auto; border:none; border-radius:14px; padding:0;   /* margin:auto＝置中（* 的 margin:0 會蓋掉瀏覽器預設） */ width:min(520px, calc(100vw - 24px)); max-height:85vh;
         background:var(--card); color:var(--ink); box-shadow:0 8px 30px rgba(0,0,0,.3); }
  .dlg::backdrop { background:rgba(0,0,0,.4); }
  .dlg h3 { padding:16px 16px 6px; font-size:17px; }

  .dbody { padding:0 16px; overflow-y:auto; max-height:calc(85vh - 110px); display:flex; flex-direction:column; gap:6px; }
  .dbody input:not([type=date]) { width:100%; }

  .rowx { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

  @media (max-width:420px) {
    body { padding:12px; }
    header { gap:8px; }

<script>
"use strict";
// 被別的網站用 iframe 框起來（點擊劫持）就整頁不顯示；GitHub Pages 無法送 X-Frame-Options 標頭，只能這樣擋
if (window.top !== window.self) document.documentElement.hidden = true;
/* ═══════════ 基本設定 ═══════════ */
// Supabase publishable key 出現在原始碼是官方設計（安全靠 RLS），不是洩漏。
const SUPABASE_URL = "https://zdfhieekhaaqfarqpslc.supabase.co";
const SUPABASE_KEY = "sb_publishable_jIw3eJ0CW-rmGL7b9Wh3XQ_cQMDIegf";
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const nt = n => "NT$ " + Math.round(Number(n) || 0).toLocaleString("en-US");
const css = k => getComputedStyle(document.documentElement).getPropertyValue(k).trim();
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(parent, ...kids){ for (const k of kids) if (k) parent.appendChild(k); return parent; }

/* ═══════════ 狀態 ═══════════ */
let E;                       // engine.js（defer 載入後才有）
let sb = null, hid = null;
let sel = null;              // 成員篩選：null＝全家合併
let period = null;
const S = {                  // 不隨期間變的設定類資料
  members: [], accounts: [], catRules: [], labels: [], excludeRules: [], filterRules: [], cats: [], subIgnores: new Set()
};
const periodCache = new Map();   // 期間 key → { txs, prevTxs, range6, acctTxnsWide }
const openSec = new Map();       // 各區開合狀態（換期間不會被洗回收合，同 App v93）
const ui = { chart: 0, cardSrc: null, bars: new Set() };
let charts = [];

/* ═══════════ 畫面切換 ═══════════ */
const VIEWS = ["status", "login", "nomember", "errorBox", "app"];
function showView(name){ for (const v of VIEWS) $(v).hidden = (v !== name); }
function showStatus(msg){ $("statusMsg").textContent = msg; showView("status"); }
function showError(msg){ $("errorMsg").textContent = msg; showView("errorBox"); }

/* ═══════════ 資料載入（同 App AnalysisScreen：本期、前期、近 6 月、存款流水寬窗 ±5 天） ═══════════ */
async function pagedFetch(mk){
  // ⚠️ 伺服器每次最多回 1000 列：一定要分頁。App 的 limit(5000) 只拿到 1000 列，
  //    近 6 月趨勢與訂閱偵測因此少算（2026-11-01 對照實測抓到）——網頁版不重蹈。
  // 排序一定補上 id 當尾鍵：只排日期的話同一天的列在不同頁之間順序不固定，跨頁會重複或漏列
  // （billbook 踩過）。再用 id 去重當保險。
  const seen = new Map();
  for (let page = 0; ; page++){
    const { data, error } = await mk().order("id").range(page * 1000, page * 1000 + 999);
    if (error) throw error;
    for (const r of data || []) seen.set(r.id, r);
    if (!data || data.length < 1000) return [...seen.values()];
  }
}
const selAll = (table, order) => pagedFetch(() => {
  const q = sb.from(table).select("*").eq("household_id", hid);
  return order ? q.order(order) : q;
});
async function loadStatic(){
  const [members, accounts, catRules, labels, excludeRules, filterRules, cats, ign] = await Promise.all([
    selAll("members", "sort_order"), selAll("asset_accounts", "sort_order"), selAll("category_rules"),
    selAll("category_labels", "sort_order"), selAll("exclude_rules"), selAll("filter_rules"),
    selAll("categories", "sort_order"),
    selAll("subscription_ignores").catch(e => { console.warn("非訂閱清單讀取失敗", e); return null; })
  ]);
  Object.assign(S, { members, accounts, catRules: E.sortCategoryRules(catRules), labels, excludeRules,
                     filterRules, cats, subIgnoreErr: ign == null, subIgnores: new Set((ign || []).map(r => r.pattern)) });
}
const txRange = (a, b) => pagedFetch(() => sb.from("transactions").select("*")
  .eq("household_id", hid).eq("dedup_status", "unique")
  .gte("occurred_at", a).lt("occurred_at", b).order("occurred_at", { ascending: false }))
  .then(rows => rows.filter(t => t.occurred_at >= a && t.occurred_at < b));   // 客戶端再夾一次邊界

function addDays(t, n){ return new Date(Date.parse(t + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10); }
const periodKey = p => JSON.stringify(p);

let cacheGen = 0;   // 每次清快取 +1：清之前就發出、清之後才回來的舊資料不寫回快取
async function loadPeriod(p){
  const key = periodKey(p), gen = cacheGen;
  if (periodCache.has(key)) return periodCache.get(key);
  const P = E.Period, pv = P.prev(p), an = P.anchorMonth(p);
  const [y5, m5] = E.ymAdd(an.y, an.m, -5), [y1, m1] = E.ymAdd(an.y, an.m, 1);
  const ids = S.accounts.map(a => a.id);
  const ws = addDays(P.startDate(p), -5), we = addDays(P.endExclusive(p), 5);
  const [txs, prevTxs, range6, acctTxnsWide] = await Promise.all([
    txRange(P.startDate(p), P.endExclusive(p)),
    txRange(P.startDate(pv), P.endExclusive(pv)),
    txRange(`${y5}-${pad(m5)}-01`, `${y1}-${pad(m1)}-01`),
    ids.length ? pagedFetch(() => sb.from("account_transactions").select("*").in("account_id", ids)
      .gte("occurred_at", ws).lt("occurred_at", we).order("occurred_at", { ascending: false })) : []
  ]);
  const d = { txs, prevTxs, range6, acctTxnsWide };
  if (gen === cacheGen) periodCache.set(key, d);
  return d;
}

/* ═══════════ 繪製 ═══════════ */
// 每次 render 編號：網路慢時連點 ◀，晚回來的舊月份資料不能蓋掉新畫面（否則標題 6 月、數字 7 月）
let renderSeq = 0;
async function render(quiet){
  const my = ++renderSeq, p = period;
  try {
    // 已經有畫面時切月份不整頁換成「讀取中」（捲動位置不跳），只在標題下提示
    if (!quiet){ if (lastData) $("periodLabel").textContent = E.Period.label(p) + "　讀取中…"; else showStatus("讀取資料中…"); }
    const d = DEMO ? demoPeriod(p) : await loadPeriod(p);
    if (my !== renderSeq) return;
    showView("app");
    paint(d, p);
    netOk();
  } catch (e){
    if (my !== renderSeq) return;
    console.error(e);
    if (lastData){   // 有舊畫面就留著，頂端說清楚；期間退回畫面上那一期（不然再按 ◀ 會從沒顯示過的月份往前跳）
      if (!quiet && lastPeriod) period = lastPeriod;
      netFail(e, quiet ? null : E.Period.label(p));
      paintPeriodBar();
    }
    else showError("讀取資料失敗：" + (e && e.message ? e.message : e));
  }
}
/** 背景更新失敗要講：不然離線時畫面看起來正常，其實是舊的 */
let shownAt = null;
function netOk(){ shownAt = new Date(); $("netMsg").hidden = true; }
function netFail(e, what){
  console.warn("讀取失敗，畫面保留上一份", e);
  const head = what ? `⚠️ ${what} 讀取失敗，` : "⚠️ ";
  $("netMsg").textContent = navigator.onLine === false || /fetch|network/i.test(String(e && e.message))
    ? `${head}目前連不上伺服器，顯示的是 ${shownAt ? hhmm(shownAt.toISOString()) : "先前"} 的資料；恢復連線後會自動更新`
    : `${head}讀取最新資料失敗：` + (e && e.message ? e.message : e);
  $("netMsg").hidden = false;
}

function paintPeriodBar(){
  const p = lastPeriod || period;
  $("periodLabel").textContent = E.Period.label(p);
  $("btnNext").disabled = !E.Period.canNext(p);
}
function buildChips(){
  const box = $("chips");
  box.replaceChildren();
  const mk = (label, val) => {
    const b = el("button", "chip" + (sel === val ? " active" : ""), label);
    b.addEventListener("click", () => { sel = val; buildChips(); render(true); });
    box.appendChild(b);
  };
  mk("👨‍👩‍👧 合併", null);
  for (const m of S.members) mk(m.nickname || m.name || "成員", m.id);
}

/** 一個摺疊區塊；body 是函式＝收合時不組裝（同 App：收著就不畫） */
function fold(key, title, summary, body){
  const box = el("section", "fold");
  const open = openSec.get(key) === true;
  const head = el("button", "head");
  head.setAttribute("aria-expanded", String(open));
  const t = add(el("div", "t"), el("span", null, title), el("span", "tog", open ? "收合 ▴" : "展開 ▾"));
  add(head, t, summary ? el("div", "sum", summary) : null);
  head.addEventListener("click", () => { openSec.set(key, !open); repaint(); });
  box.appendChild(head);
  if (open){ const b = el("div", "body"); body(b); box.appendChild(b); }
  return box;
}
function row(label, value, cls){
  return add(el("div", "row"), el("span", null, label), el("b", cls || null, value));
}
function sbar(label, amount, max, total, opts = {}){
  const w = el("div", "sbar");
  add(w, add(el("div", "lbl"), el("span", null, label),
             el("span", null, nt(amount) + (total > 0 ? ` · ${Math.trunc(amount * 100 / total)}%` : ""))));
  const tr = el("div", "track" + (opts.cls ? " " + opts.cls : ""));
  const fill = el("div");
  fill.style.width = (max > 0 ? Math.min(1, Math.max(0.02, amount / max)) : 0.02) * 100 + "%";
  w.appendChild(add(tr, fill));
  if (opts.onClick){
    w.setAttribute("role", "button"); w.tabIndex = 0; w.addEventListener("click", opts.onClick);
    w.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); opts.onClick(); } });
  }
  return w;
}
/** 新到舊；同日維持原順序（比較器相等要回 0，否則排序不穩定） */
const newestFirst = (dateOf = t => t.occurred_at) => (a, b) => (dateOf(a) < dateOf(b) ? 1 : dateOf(a) > dateOf(b) ? -1 : 0);
/** 展開的逐筆（同 App SourceDetail） */
function detail(rows, total, nameOf = t => t.merchant || t.note || "（無商家）", dateOf = t => t.occurred_at){

  // ── 🚫 已排除（未計入收支） ──

/* ═══════════ ✈️ 旅遊（Trips.kt）：行程＝日期區間＋單筆例外（trip_tx） ═══════════ */
// tripDirty＝要重抓；重抓期間保留舊的 tripState（畫面與按鈕照常可用，標「更新中…」），新的到了再換
let tripState = null, tripLoading = false, tripErr = "", tripDirty = false;

/** 一次批次載入（同 App v78）：行程、例外、涵蓋所有行程的交易、區間外手動加入的、配對用存款流水。 */
async function loadTrips(){
  const trips = await Store.trips();
  const overrides = new Map(trips.map(t => [t.id, new Map()]));
  for (const r of await Store.tripTx(trips.map(t => t.id)))
    overrides.get(r.trip_id)?.set(r.transaction_id, r.action);
  if (!trips.length) return { trips, overrides, txs: [], auto: new Map() };
  // 各趟行程分開抓（相隔一個月內的併成一段）：不要因為 2024 與 2026 各有一趟就把中間兩年全抓下來
  const spans = [];
  for (const t of trips.slice().sort((a, b) => (a.start_date < b.start_date ? -1 : 1))){
    const last = spans[spans.length - 1];
    if (last && addDays(last[1], 31) >= t.start_date){ if (t.end_date > last[1]) last[1] = t.end_date; }
    else spans.push([t.start_date, t.end_date]);
  }
  const byId = new Map();
  for (const [a, z] of spans) for (const t of await Store.txAll(a, addDays(z, 1))) byId.set(t.id, t);
  const includeIds = [...new Set([...overrides.values()].flatMap(m => [...m].filter(([, a]) => a === "include").map(([id]) => id)))]
    .filter(id => !byId.has(id));
  const all = [...byId.values()].concat(await Store.txByIds(includeIds));
  // 存款流水只抓每筆交易前後 5 天會碰到的段落（配對互轉/退款用）
  const wide = new Map();
  const dates = [...new Set(all.map(t => t.occurred_at).filter(Boolean))].sort();
  const wspans = [];
  for (const d of dates){
    const last = wspans[wspans.length - 1];
    if (last && addDays(last[1], 11) >= d) last[1] = d; else wspans.push([d, d]);
  }
  for (const [a, z] of wspans) for (const t of await Store.acct(addDays(a, -5), addDays(z, 6))) wide.set(t.id, t);
  return { trips, overrides, txs: all, auto: E.autoExclusions(all, [...wide.values()], S.accounts, S.members)[0] };
}
function reloadTrips(){
  tripErr = "";
  if (openSec.get("trip")){ tripDirty = true; ensureTrips(); repaint(); }
  else { tripState = null; repaint(); }
}
function ensureTrips(){
  if (tripLoading || (tripState && !tripDirty)) return;
  tripLoading = true; tripDirty = false;
  loadTrips().then(s => { tripState = s; tripErr = ""; }, e => { tripErr = "讀取行程失敗：" + (e.message || e); })
             .finally(() => { tripLoading = false; if (tripDirty) ensureTrips(); repaint(); });
}

function paintTrips(b){
  add(b, el("p", "note", "設定旅行的日期區間，期間內的消費會自動算成這趟旅行。分類與每月統計不受影響，只是多一個角度看「這趟花了多少」。"));
  if (tripDirty) ensureTrips();
  if (tripErr && !tripState){ const r = el("button", null, "重試"); r.addEventListener("click", reloadTrips); add(b, el("p", "warn", tripErr), r); return; }
  if (!tripState){ ensureTrips(); add(b, el("p", "muted", "讀取行程中…")); return; }
  if (tripLoading) add(b, el("p", "muted", "🔄 更新中…"));
  else if (tripErr) add(b, el("p", "warn", tripErr + "（下方是上一次的資料）"));
  const { trips, overrides, txs, auto } = tripState;
  if (!trips.length) add(b, el("p", "muted", "還沒有行程。按下方「新增行程」，填上名稱與起訖日就好。"));
  const L = k => E.labelOf(k, S.labels);
  const exc = t => E.effExcludeF(t, auto, S.excludeRules, S.filterRules);
  const catOf = t => E.classifyF(t, S.catRules, S.filterRules, S.cats);
  const mine = sel == null ? txs : txs.filter(t => E.txOwnerId(t, S.members) === sel);
  for (const tp of trips){
    const ov = overrides.get(tp.id) || new Map();
    const s = E.tripSummary(tp, mine, ov, exc, catOf);
    const open = ui.bars.has("trip:" + tp.id);
    const head = el("button", "triphead");
    add(head, add(el("span", "m"), el("b", null, (open ? "▾ " : "▸ ") + tp.name),
                  el("small", null, `${tp.start_date} ~ ${tp.end_date}　${s.counted.length} 筆`)), el("b", null, nt(s.total)));
    head.addEventListener("click", () => toggleBar("trip:" + tp.id));
    const box = add(el("div", "trip"), head);
    b.appendChild(box);
    if (!open) continue;
    if (!s.rows.length) add(box, el("p", "note", "這段期間沒有支出紀錄。"));
    const mx = s.byCat.length ? s.byCat[0][2] : 0;
    for (const [c, rows, amt] of s.byCat){
      const key = `trip:${tp.id}/${c}`, catOpen = ui.bars.has(key);
      const exN = rows.filter(t => exc(t)[0]).length;
      add(box, sbar(L(c), amt, mx, s.total, { onClick: () => toggleBar(key) }),
        el("p", "note", `　${rows.length} 筆` + (exN ? `，${exN} 未計` : "") + (catOpen ? "" : "　點開看細項")));
      if (catOpen){
        for (const t of rows.slice().sort(newestFirst()))
          box.appendChild(txRow(t, exc(t), !E.covers(tp, t.occurred_at) ? "↳ 手動加入這趟（日期不在區間內）" : "",
                                () => tripTxDialog(tp, t)));
        add(box, el("p", "note", "點單筆可以改分類，或把它移出這趟行程。"));
      }
    }
    if (s.kicked.length){
      const kKey = `trip:${tp.id}/__kicked`, kOpen = ui.bars.has(kKey);
      const k = el("button", "link", `${kOpen ? "▾" : "▸"} 已移出這趟（${s.kicked.length} 筆）`);
      k.addEventListener("click", () => toggleBar(kKey));
      box.appendChild(k);
      if (kOpen){
        for (const t of s.kicked.slice().sort(newestFirst())) box.appendChild(txRow(t, [true, "已移出這趟行程"], "", () => tripTxDialog(tp, t)));
        add(box, el("p", "note", "點一下可以加回這趟行程。這些筆仍照常算在當月支出裡，只是不算這趟旅行。"));
      }
    }
    add(box, el("p", "note", `共 ${s.days} 天，平均每天 ${nt(Math.trunc(s.total / Math.max(1, s.days)))}` +
                              (s.manualN ? `　（${s.manualN} 筆手動調整過）` : "")));
    const addBtn = el("button", null, "➕ 把其他消費加進這趟");
    addBtn.addEventListener("click", () => tripAddDialog(tp));
    const del = el("button", "link danger", "刪除這趟行程");
    del.addEventListener("click", async () => {
      if (!confirm(`要刪除「${tp.name}」嗎？\n只會刪掉行程設定，交易紀錄不會被刪。`)) return;
      await guarded(() => Store.deleteTrip(tp.id));
      reloadTrips();
    });
    add(box, addBtn, el("p", "note", "出發前訂的機票飯店、回國後才入帳的刷卡，都可以從這裡加進來。"), del);
  }
  const nb = el("button", null, "➕ 新增行程");
  nb.addEventListener("click", newTripDialog);
  add(b, nb);
}

/* ── 對話框（原生 <dialog>） ── */
function dialog(title){
  const d = el("dialog", "dlg");
  const body = el("div", "dbody");
  const close = el("button", null, "關閉");
  close.autofocus = true;   // 預設焦點不放輸入框：手機上一開對話框就跳鍵盤會遮掉一半
  add(d, el("h3", null, title), body, add(el("div", "dfoot"), close));
  close.addEventListener("click", () => d.close());
  d.addEventListener("close", () => d.remove());
  document.body.appendChild(d);
  d.showModal();
  return { d, body, close };
}
/** 寫入失敗一定要講出來（App v74 的教訓：按了、關了、什麼都沒變，使用者完全不知道） */
async function guarded(fn, errEl){
  try { await fn(); return true; }
  catch (e){
    const msg = "存檔失敗：" + (e && e.message ? e.message : e);
    if (errEl) errEl.textContent = msg; else alert(msg);
    return false;
  }
}

function tripTxDialog(tp, t){
  if (!tripState) return;
  const ov = tripState.overrides.get(tp.id) || new Map();
  const isIn = E.inTrip(t, tp, ov);
  const cur = E.classifyF(t, S.catRules, S.filterRules, S.cats);
  const { d, body } = dialog("這筆消費");
  const err = el("p", "warn");
  add(body, el("b", null, t.merchant || t.note || "（無備註）"),
    el("p", "muted", `${t.occurred_at} · ${nt(t.amount)} · 目前分類：${E.labelOf(cur, S.labels)}`),
    el("h4", null, "✈️ 行程歸屬"), el("p", "muted", `「${tp.name}」　目前：${E.tripMemberState(t, tp, ov)}`));
  const mb = el("button", isIn ? null : "primary", isIn ? "➖ 移出這趟行程" : "➕ 加回這趟行程");
  mb.addEventListener("click", async () => {
    mb.disabled = true;
    const a = E.tripTxAction(tp, t.occurred_at, !isIn);

      d.close(); reloadTrips();

  if (t.merchant){
    const pick = el("select");

    // 目前分類不在選單裡（例如手動建的分類）也要列出來，否則預設停在第一項，按套用會被悄悄改掉
    if (!opts.some(([k]) => k === cur)) opts.unshift([cur, E.labelOf(cur, S.labels)]);

      else apply.disabled = false;
    });

      el("p", "note", "同商家的每一筆都會跟著改（全站一起變）。"));

function tripAddDialog(tp){
  if (!tripState) return;
  const ov = tripState.overrides.get(tp.id) || new Map();
  const already = new Set(tripState.txs.filter(t => E.inTrip(t, tp, ov)).map(t => t.id));
  const addedIds = new Set();
  const { d, body } = dialog(`加進「${tp.name}」`);
  const q = el("input"); q.placeholder = "🔍 搜尋商家或備註";
  const info = el("p", "muted"), err = el("p", "warn"), list = el("div");
  add(body, el("p", "note", `只會列出不在行程區間（${tp.start_date} ~ ${tp.end_date}）內的消費——區間內的本來就已經算進去了。不搜尋＝列出行程前後 14 天的。`),
    q, info, err, list);
  d.addEventListener("close", () => { if (addedIds.size) reloadTrips(); });   // 加過就一定要刷新（含點外面關掉）
  let nearby = null, found = null, failed = "", timer = 0, seq = 0;
  const draw = () => {
    const searching = q.value.trim().length >= 2;
    const src = searching ? found : nearby;
    list.replaceChildren();
    if (failed){ list.appendChild(el("p", "warn", failed)); return; }
    if (!src){ list.appendChild(el("p", "muted", "讀取中…")); return; }
    const cands = E.tripAddCandidates(src, tp, new Set([...already, ...addedIds]))
      .filter(t => sel == null || E.txOwnerId(t, S.members) === sel);
    if (!cands.length) list.appendChild(el("p", "muted", searching ? "找不到符合的消費。" : "行程前後 14 天沒有其他消費。用上面的搜尋找更早或更晚的。"));
    for (const t of cands.slice(0, 60)){
      const r = txRow(t, [false, ""], E.labelOf(E.classifyF(t, S.catRules, S.filterRules, S.cats), S.labels), async () => {
        r.disabled = true; err.textContent = "";
        if (await guarded(() => Store.setTripTx(tp.id, t.id, "include"), err)){
          addedIds.add(t.id); info.textContent = `已加入 ${addedIds.size} 筆`; draw();
        } else r.disabled = false;
      });
      list.appendChild(r);
    }
    if (cands.length > 60) list.appendChild(el("p", "note", "只顯示前 60 筆，請用搜尋縮小範圍。"));
  };
  q.addEventListener("input", () => {
    clearTimeout(timer);
    const s = q.value.trim();
    const my = ++seq;   // 晚回來的舊搜尋不能蓋掉新的
    failed = "";
    if (s.length < 2){ draw(); return; }
    timer = setTimeout(async () => {
      found = null; draw();
      try { const r = await Store.search(s); if (my === seq){ found = r; draw(); } }
      catch (e){ if (my === seq){ failed = "搜尋失敗：" + (e.message || e) + "（請確認網路後再打一次字）"; draw(); } }
    }, 350);
  });
  Store.txAll(addDays(tp.start_date, -14), addDays(tp.end_date, 15))
    .then(r => { nearby = r; draw(); }, e => { nearby = []; failed = "讀取失敗：" + (e.message || e); draw(); });
  draw();
}

/* ═══════════ 資料存取（旅遊、分類、訂閱用）：live 走 Supabase（RLS），demo 改頁內陣列 ═══════════ */
const must = ({ data, error }) => { if (error) throw error; return data; };
/** id 清單每 100 個一批查（全塞進一個網址，累積幾百筆後會超過閘道的網址長度上限） */
async function byIdChunks(ids, q){
  const out = [];
  for (let i = 0; i < ids.length; i += 100) out.push(...must(await q(ids.slice(i, i + 100))));
  return out;
}
const LiveStore = {
  trips: () => sb.from("trips").select("*").eq("household_id", hid).order("start_date", { ascending: false }).then(must),
  tripTx: ids => byIdChunks(ids, c => sb.from("trip_tx").select("*").in("trip_id", c)),
  txAll: (a, b) => pagedFetch(() => sb.from("transactions").select("*").eq("household_id", hid).neq("dedup_status", "merged")
      .gte("occurred_at", a).lt("occurred_at", b).order("occurred_at", { ascending: false }))
    .then(rows => rows.filter(t => t.occurred_at >= a && t.occurred_at < b)),
  txByIds: ids => byIdChunks(ids, c => sb.from("transactions").select("*").in("id", c)),
  acct: (a, b) => (S.accounts.length ? pagedFetch(() => sb.from("account_transactions").select("*")
      .in("account_id", S.accounts.map(x => x.id)).gte("occurred_at", a).lt("occurred_at", b)
      .order("occurred_at", { ascending: false })) : Promise.resolve([])),
  search(q){
    const s = q.replace(/[,()*%"\\]/g, "");   // PostgREST or() 的語法字元一律拿掉
    return sb.from("transactions").select("*").eq("household_id", hid).neq("dedup_status", "merged")
      .or(`merchant.ilike.*${s}*,note.ilike.*${s}*`).order("occurred_at", { ascending: false }).limit(300).then(must);
  },
  addTrip: (name, s, e) => sb.from("trips").insert({ household_id: hid, name, start_date: s, end_date: e, note: "" }).then(must),
  // 被權限擋掉的刪除不會報錯、只是刪了 0 列 → 要回傳刪掉的列來確認，否則畫面說成功其實沒刪
  deleteTrip: async id => {
    if (!must(await sb.from("trips").delete().eq("id", id).select("id")).length) throw new Error("沒有刪到（可能已被刪除或沒有權限）");
  },
  // 一筆一趟只留一列（表上有 unique(trip_id, transaction_id)）：用 upsert 一次寫完，
  // 不像先刪再寫那樣「刪成功、寫失敗」就把原本的設定弄丟
  setTripTx: (tripId, txId, action) => sb.from("trip_tx")
    .upsert({ trip_id: tripId, transaction_id: txId, action }, { onConflict: "trip_id,transaction_id" }).then(must),
  clearTripTx: (tripId, txId) => sb.from("trip_tx").delete().eq("trip_id", tripId).eq("transaction_id", txId).then(must),
  setCategoryRule: (merchant, category) => sb.rpc("set_category_rule", { hid, p_merchant: merchant, p_category: category }).then(must)
};
const DemoStore = {
  trips: async () => DEMO_DATA.trips.slice().sort((a, b) => (a.start_date < b.start_date ? 1 : -1)),
  tripTx: async () => DEMO_DATA.tripTx.slice(),
  txAll: async (a, b) => DEMO_DATA.txs.filter(t => t.occurred_at >= a && t.occurred_at < b),
  txByIds: async ids => DEMO_DATA.txs.filter(t => ids.includes(t.id)),
  acct: async (a, b) => DEMO_DATA.acct.filter(t => t.occurred_at >= a && t.occurred_at < b),
  search: async q => DEMO_DATA.txs.filter(t => (t.merchant + t.note).toLowerCase().includes(q.toLowerCase())),
  addTrip: async (name, s, e) => { DEMO_DATA.trips.push({ id: "trip" + Date.now(), name, start_date: s, end_date: e }); },
  deleteTrip: async id => { DEMO_DATA.trips = DEMO_DATA.trips.filter(t => t.id !== id); },
  setTripTx: async (trip_id, transaction_id, action) => {
    await DemoStore.clearTripTx(trip_id, transaction_id); DEMO_DATA.tripTx.push({ trip_id, transaction_id, action });
  },
  clearTripTx: async (tripId, txId) => {
    DEMO_DATA.tripTx = DEMO_DATA.tripTx.filter(r => !(r.trip_id === tripId && r.transaction_id === txId));
  },
  setCategoryRule: async (merchant, category) => { S.catRules = [{ merchant, category, source: "user" }, ...S.catRules]; }
};

const PIE_COLORS = ["#0abde3", "#feca57", "#5f27cd", "#ff9f43", "#54a0ff", "#01a3a4", "#f368e0",
                    "#576574", "#3ae374", "#ee5253", "#10ac84", "#8395a7", "#e77f67", "#786fa6"];
function drawChart(cv, byCat, trend6){
  if (!window.Chart || !cv.isConnected) return;
  const ink = css("--ink"), sub = css("--sub"), L = k => E.labelOf(k, S.labels);
  const nf = v => nt(v);
  if (ui.chart === 0){
    // 圖例帶百分比（同 App 圓餅：四捨五入；長條那邊是截斷，與 App 各自一致）
    const tot = byCat.reduce((a, c) => a + c[1], 0);
    charts.push(new Chart(cv, { type: "doughnut",
      data: { labels: byCat.map(c => `${L(c[0])} ${tot > 0 ? Math.round(c[1] * 100 / tot) : 0}%`),
              datasets: [{ data: byCat.map(c => c[1]), backgroundColor: byCat.map((_, i) => PIE_COLORS[i % PIE_COLORS.length]), borderWidth: 0 }] },
      options: { plugins: { legend: { position: "bottom", labels: { color: ink, boxWidth: 12 } },
                            tooltip: { callbacks: { label: c => `${c.label} ${nf(c.raw)}` } } } } }));
  } else {
    const data = ui.chart === 1 ? byCat.map(c => [L(c[0]), c[1]]) : trend6;
    charts.push(new Chart(cv, { type: "bar",
      data: { labels: data.map(x => x[0]), datasets: [{ data: data.map(x => x[1]), backgroundColor: "#0abde3", borderRadius: 4 }] },
      options: { indexAxis: ui.chart === 1 ? "y" : "x", maintainAspectRatio: ui.chart !== 1, plugins: { legend: { display: false },
                   tooltip: { callbacks: { label: c => nf(c.raw) } } },
                 scales: { x: { ticks: { color: sub } }, y: { ticks: { color: sub } } } } }));
  }
}

function setPeriod(p){

function bindNav(){
  $("btnPrev").addEventListener("click", () => setPeriod(E.Period.prev(period)));
  $("btnNext").addEventListener("click", () => { if (E.Period.canNext(period)) setPeriod(E.Period.next(period)); });
  $("btnPeriod").addEventListener("click", () => {
    const pk = $("picker"); pk.hidden = !pk.hidden;
    $("btnPeriod").setAttribute("aria-expanded", String(!pk.hidden));
    const st = E.Period.startDate(period), today = E.todayIso();
    $("pickMonth").value = st.slice(0, 7); $("pickMonth").max = today.slice(0, 7);

  $("btnPickMonth").addEventListener("click", () => {
    const v = $("pickMonth").value;
    if (!/^\d{4}-\d{2}$/.test(v)) $("pickErr").textContent = "請先選一個月份";
    else if (v > E.todayIso().slice(0, 7)) $("pickErr").textContent = "還沒到這個月份";
    else setPeriod(E.Period.month(+v.slice(0, 4), +v.slice(5, 7)));

  $("btnRetry").addEventListener("click", () => location.reload());

const LIVE_EVERY = 60_000;

async function dataMark(){
  const one = q => q.limit(1).then(({ data, error }) => { if (error) throw error; return data && data[0]; });
  const [t, s, r] = await Promise.all([
    one(sb.from("transactions").select("created_at").eq("household_id", hid).order("created_at", { ascending: false })),
    one(sb.from("ingest_settings").select("last_run_at").eq("household_id", hid)),
    one(sb.from("sync_requests").select("finished_at").eq("household_id", hid).eq("status", "done")
          .order("finished_at", { ascending: false }))
  ]);
  return [t?.created_at, s?.last_run_at, r?.finished_at].join("|");
}
let inflight = null;
function refreshData(){
  if ($("app").hidden) return Promise.resolve();
  // 正在重抓時又有人要求（同步完成、剛改分類）→ 記下來，這輪跑完再跑一次；直接丟掉的話畫面會停在改之前。
  // 回傳進行中的那一輪（含加跑），呼叫端 await 到的就是「畫面真的更新完」
  if (refreshing){ rerun = true; return inflight; }
  return (inflight = doRefresh());
}
async function doRefresh(){
  refreshing = true;
  try {
    do {
      rerun = false;
      // 先取標記再抓資料：抓的途中有新資料進來，標記就會不同，下一分鐘自然再抓一次（反過來會把沒抓到的標成看過）
      const mark = DEMO ? null : await dataMark();
      tripDirty = true;                 // 行程跟著重抓（開著才會真的載入；重抓中保留舊畫面）
      if (!DEMO){ await loadStatic(); periodCache.clear(); cacheGen++; }
      buildChips();
      await render(true);
      liveMark = mark; lastFull = Date.now();
    } while (rerun);
  } catch (e){ netFail(e); }
  finally { refreshing = false; }
}
async function checkLive(){
  if (document.hidden || refreshing || !hid) return;
  try {
    const mark = await dataMark();
    if (liveMark !== null && mark !== liveMark) await refreshData();
    else { liveMark = mark; if (!$("netMsg").hidden && lastData) render(true); }   // 剛恢復連線：順手補抓
  } catch (e){ netFail(e); }
}
// 頁面本身有新版（伺服器上的 index.html 換了）→ 切回來時自動重新載入，等於 App 自動更新
let pageTag = null;
async function pageVersion(){
  const res = await fetch(location.pathname, { method: "HEAD", cache: "no-store" });
  return res.headers.get("etag") || res.headers.get("last-modified");
}
function startLiveUpdates(){
  liveMark = null; lastFull = Date.now();
  checkLive();
  window.addEventListener("online", () => refreshData());
  setInterval(checkLive, LIVE_EVERY);
  pageVersion().then(v => { pageTag = v; }).catch(() => {});
  document.addEventListener("visibilitychange", async () => {
    if (document.hidden) return;
    try {
      const v = await pageVersion();
      if (pageTag && v && v !== pageTag && !syncing){ location.reload(); return; }
    } catch (_){ /* 離線：照用目前這版 */ }
    // 切出去回個訊息馬上回來，不必整份重抓（20 多個請求）；30 秒內只比對標記，有變才抓
    if (Date.now() - lastFull < 30_000) checkLive(); else refreshData();
  });
}

/* ═══════════ 立即同步（同 App：寫 sync_requests → 雲端撈信 → 輪詢到完成） ═══════════ */
// DB 端有兩道防連點（60 秒節流、同家庭只允許一筆進行中）；錯誤翻成白話，不把 SQL 訊息丟給使用者。
let syncing = false;
function hhmm(iso){
  if (!iso) return "";
  const d = new Date(iso);
  return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
async function showLastSync(prefix = ""){
  const { data } = await sb.from("ingest_settings").select("last_run_at, last_error").eq("household_id", hid).limit(1);
  const s = data && data[0];
  const { data: done } = await sb.from("sync_requests").select("finished_at")
    .eq("household_id", hid).eq("status", "done").order("finished_at", { ascending: false }).limit(1);
  const last = [s?.last_run_at, done?.[0]?.finished_at].filter(Boolean).sort().pop();
  $("syncMsg").textContent = prefix + (last ? `上次同步 ${hhmm(last)}` : "") +
    (s?.last_error ? `　⚠️ 上次撈取有錯誤：${(String(s.last_error).split("\n").filter(Boolean).pop() || "").slice(0, 80)}` : "");
}
async function watchSync(id){
  syncing = true;
  $("btnSync").disabled = true;
  let st = "pending";
  for (let i = 0; i < 360 && st !== "done" && st !== "failed"; i++){   // 上限 30 分鐘
    await new Promise(r => setTimeout(r, 5000));
    const { data } = await sb.from("sync_requests").select("status").eq("id", id).limit(1);
    st = data?.[0]?.status || st;
  }
  syncing = false;
  $("btnSync").disabled = false;
  if (st === "done"){ await refreshData(); await showLastSync("✅ 同步完成，畫面已更新　"); }
  else if (st === "failed") $("syncMsg").textContent = "❌ 這次撈取失敗了；資料沒有遺失，下次同步會重撈同一段時間";
  else $("syncMsg").textContent = "⚠️ 同步逾時（超過 30 分鐘），請稍後再試";
}
async function startSync(){
  if (syncing) return;
  $("syncMsg").textContent = "同步中…已送出，雲端撈取中（約 1～3 分鐘）";
  // 卡住超過 20 分鐘的 pending 先結案：雲端那輪若沒跑完（token 失效、被取代、逾時）沒人會來標，
  // 而「同家庭只許一筆 pending」會擋掉之後每一次同步（資料庫端 v94 也做同一件事，雙保險）
  await sb.from("sync_requests").update({ status: "failed", finished_at: new Date().toISOString() })
    .eq("household_id", hid).eq("status", "pending")
    .lt("requested_at", new Date(Date.now() - 20 * 60_000).toISOString());
  const { data, error } = await sb.from("sync_requests").insert({ household_id: hid }).select("id").single();
  if (error || !data){
    const m = (error && error.message) || "";
    if (m.includes("uniq_sync_pending") || m.includes("duplicate key")){
      // 別台裝置（或 App）的同步還在跑：接著等它，完成時一樣自動更新
      const { data: p } = await sb.from("sync_requests").select("id").eq("household_id", hid).eq("status", "pending").limit(1);
      $("syncMsg").textContent = "⏳ 已有一次同步在進行中，完成後畫面會自己更新";
      if (p && p.length) watchSync(p[0].id);
      return;
    }
    $("syncMsg").textContent = m.includes("過於頻繁") ? "⏳ 剛剛才同步過，請等約一分鐘再按" : "❌ 送出失敗，請確認網路後再試";
    return;
  }
  watchSync(data.id);
}
async function initSync(){
  $("btnSync").hidden = false;
  $("btnSync").addEventListener("click", startSync);
  // 別的裝置（或 App）按了同步還沒跑完 → 接著等，完成時一樣自動更新
  const since = new Date(Date.now() - 30 * 60_000).toISOString();
  const { data } = await sb.from("sync_requests").select("id").eq("household_id", hid)
    .not("status", "in", "(done,failed)").gte("requested_at", since)
    .order("requested_at", { ascending: false }).limit(1);
  if (data && data.length){ $("syncMsg").textContent = "同步中…雲端撈取尚未完成"; watchSync(data[0].id); }
  else await showLastSync();
}

/* ═══════════ 示範模式（合成資料，皆虛構；部署前看版面用） ═══════════ */
function demoPeriod(p){
  const a = E.Period.startDate(p), b = E.Period.endExclusive(p), pv = E.Period.prev(p), an = E.Period.anchorMonth(p);
  const [y5, m5] = E.ymAdd(an.y, an.m, -5), [y1, m1] = E.ymAdd(an.y, an.m, 1);
  const inR = (x, s, e) => x.occurred_at >= s && x.occurred_at < e;
  const all = DEMO_DATA.txs;
  return { txs: all.filter(t => inR(t, a, b)), prevTxs: all.filter(t => inR(t, E.Period.startDate(pv), E.Period.endExclusive(pv))),
           range6: all.filter(t => inR(t, `${y5}-${pad(m5)}-01`, `${y1}-${pad(m1)}-01`)),
           acctTxnsWide: DEMO_DATA.acct.filter(t => inR(t, addDays(a, -5), addDays(b, 5))) };
}

    acct.push({ id: "s" + (++n), account_id: "a1", occurred_at: day(5), amount: 68000, description: "薪資", note: "" });
    acct.push({ id: "w" + (++n), account_id: "a1", occurred_at: day(6), amount: -20000, description: "網銀轉出", note: "" });

async function afterLogin(session){
  try {
    $("who").textContent = "登入：" + (session.user.email || "");
    $("btnSignOut").hidden = false;
    showStatus("確認家庭成員資格中…");
    const { data: hm, error } = await sb.from("household_members").select("household_id")
      .eq("user_id", session.user.id).order("joined_at").limit(1);
    if (error) throw error;
    if (!hm || !hm.length){ showView("nomember"); return; }
    hid = hm[0].household_id;
    showStatus("讀取設定中…");
    await loadStatic();
    buildChips();
    await render();
    startLiveUpdates();
    initSync().catch(e => console.warn("同步狀態讀取失敗", e));
  } catch (e){
    console.error(e);
    showError("初始化失敗：" + (e && e.message ? e.message : e));
  }
}
function startLive(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $("btnGoogle").addEventListener("click", async () => {
    $("loginErr").textContent = "";
    const { error } = await sb.auth.signInWithOAuth({ provider: "google",
      options: { redirectTo: location.origin + location.pathname } });
    if (error) $("loginErr").textContent = error.message;
  });
  const doSignOut = async () => { await sb.auth.signOut(); location.reload(); };
  $("btnSignOut").addEventListener("click", doSignOut);
  $("btnSignOut2").addEventListener("click", doSignOut);
  // 登入失敗（例如帳號不在 Google 測試名單）會帶著 error_description 回跳：講出來，不然看起來像按鈕壞了
  const back = new URLSearchParams(location.search + "&" + location.hash.replace(/^#/, ""));
  if (back.get("error_description") || back.get("error")){
    $("loginErr").textContent = "登入沒有成功：" + (back.get("error_description") || back.get("error")) +
                                "。若是第一次用，請確認這個 Google 帳號已被加進允許名單。";
    history.replaceState(null, "", location.pathname);
  }
  let started = false;
  sb.auth.onAuthStateChange((ev, session) => {
    // 登入過期或在別處登出：回登入頁。不處理的話之後的查詢都變成未登入，畫面會變成「沒有資料」誤導人
    if (ev === "SIGNED_OUT"){ hid = null; showView("login"); return; }
    if (session && !started){ started = true; afterLogin(session); }
  });
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session){ if (!started){ started = true; afterLogin(session); } }
    else if (!started) showView("login");
  });
}
