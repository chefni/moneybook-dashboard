const $ = id => document.getElementById(id);
const fmt = n => "NT$ " + Math.round(Number(n || 0)).toLocaleString("zh-TW");
const el = (tag, cls, text) => { const e = document.createElement(tag);

const clear = n => n.replaceChildren();

function showError(m){ $("errorMsg").textContent = m; showView("errorBox"); }

let sb = null, ctx = { statements: [], lines: {} };

// ── 對帳：三種 scope 各自的算法（零衍生，只比對原文欄位）──────────────
const fmtSigned = n => (Number(n) < 0 ? "−" : "+") + "NT$ " +
  Math.abs(Math.round(Number(n) || 0)).toLocaleString("zh-TW");

function recon(st, lines){
  if (st.lines_scope === "purchases"){
    // 空明細≠對不上：uploader 有「空明細不清空既有明細」保護，會出現只有帳單頭的期別
    if (!lines.length) return { kind: "none", text: "此期只收到帳單頭，無逐筆原文可對" };
    const sum = lines.reduce((a, l) => a + Number(l.amount), 0);
    const base = st.new_spend != null ? Number(st.new_spend)
               : (st.total_due != null ? Number(st.total_due) : null);
    if (base == null) return { kind: "none", text: "帳單未印總額，無法對帳" };
    const diff = Math.round(sum - base);
    return { kind: Math.abs(diff) < 1 ? "ok" : "bad", sum, base, diff,
             basis: st.new_spend != null ? "本期新增" : "本期應繳（無新增欄）" };
  }
  if (st.lines_scope === "ledger"){
    const all = {};                       // 該帳號全部列（含無餘額列，金額仍要計入）
    for (const l of lines) (all[l.account || ""] ||= []).push(l);
    const accts = Object.keys(all);
    if (!accts.length) return { kind: "none", text: "此對帳單無流水可對" };
    let bad = 0, okN = 0, detail = [];
    for (const a of accts){
      const rows = all[a].slice().sort((x, y) => Number(x.line_no) - Number(y.line_no));
      const withBal = rows.filter(r => r.balance != null);
      // 只有 0-1 列有餘額時，期初＝末列餘額−末列金額 會恆等於期末＝假陽性「相符」
      if (withBal.length < 2){
        detail.push({ acct: a, insufficient: true });
        continue;
      }
      const first = withBal[0], last = withBal[withBal.length - 1];
      const open = Number(first.balance) - Number(first.amount);
      const close = Number(last.balance);
      // Σ 取首尾之間的全部列（含無餘額列，例如 AI 後備解析的列），不可只加有餘額的
      const span = rows.filter(r => Number(r.line_no) >= Number(first.line_no) &&
                                    Number(r.line_no) <= Number(last.line_no));
      const d = Math.round(open + span.reduce((s, r) => s + Number(r.amount), 0) - close);
      if (Math.abs(d) >= 1) bad++; else okN++;
      detail.push({ acct: a, open, close, diff: d });
    }
    if (!okN && !bad) return { kind: "none", accounts: detail, text: "餘額列不足，無法驗證" };
    return { kind: bad ? "bad" : "ok", accounts: detail,
             text: `${accts.length} 個帳號・期初＋收支＝期末` };
  }
  return { kind: "none", text: "純餘額對帳單，僅陳列" };
}

function statusNode(r){
  if (r.kind === "ok") return el("span", "ok", "✓ 相符");
  if (r.kind === "bad")
    return el("span", "bad", r.diff != null
      ? `⚠ 逐筆比帳單${r.diff > 0 ? "多" : "少"} ${fmt(Math.abs(r.diff))}` : "⚠ 有帳號對不上");
  return el("span", "muted", r.text || "—");
}

// ── 機構總覽 ─────────────────────────────────────────────────────────
function renderInstitutions(){
  const box = $("instList"); clear(box);
  const byBank = {};
  for (const s of ctx.statements) (byBank[s.bank_name] ||= []).push(s);
  let ok = 0, bad = 0, none = 0;
  for (const name of Object.keys(byBank).sort()){
    const group = byBank[name].sort((a, b) => b.period.localeCompare(a.period));
    const head = el("div", "row");
    const left = el("div", "grow");
    left.append(el("div", null, name));
    left.append(el("div", "muted", `${group.length} 期・${group[0].kind === "credit_card" ? "信用卡" : group[0].kind === "securities" ? "證券" : "銀行"}`));
    head.append(left);
    box.append(head);
    for (const s of group){
      const r = recon(s, ctx.lines[s.id] || []);
      if (r.kind === "ok") ok++; else if (r.kind === "bad") bad++; else none++;
      const row = el("div", "row clickable");
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      const l = el("div", "grow");
      l.append(el("span", "pill", s.period));
      const scope = s.lines_scope === "purchases" ? "消費明細"
                  : s.lines_scope === "ledger" ? "存款流水" : "餘額";
      l.append(el("span", "muted", "　" + scope + "　" + (ctx.lines[s.id] || []).length + " 筆"));
      row.append(l);
      row.append(statusNode(r));
      const open = () => openDetail(s.id);
      row.addEventListener("click", open);
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      box.append(row);
    }
  }
  $("instSummary").textContent =
    `共 ${ctx.statements.length} 期帳單：相符 ${ok}、對不上 ${bad}、無法對帳 ${none}（點任一期看逐筆原文）`;
}

// ── 月份統計 ─────────────────────────────────────────────────────────
function renderMonths(){
  const box = $("monthList"); clear(box);
  const byPeriod = {};
  for (const s of ctx.statements) (byPeriod[s.period] ||= []).push(s);
  for (const p of Object.keys(byPeriod).sort().reverse()){
    const group = byPeriod[p];
    const head = el("div", "row");
    const spend = group.filter(s => s.lines_scope === "purchases")
      .reduce((a, s) => a + (ctx.lines[s.id] || []).reduce((x, l) => x + Number(l.amount), 0), 0);
    const hl = el("div", "grow");
    hl.append(el("strong", null, p));
    hl.append(el("span", "muted", `　${group.length} 份對帳單`));
    head.append(hl);
    head.append(el("span", "num", "卡片消費 " + fmt(spend)));
    box.append(head);
    for (const s of group.sort((a, b) => a.bank_name.localeCompare(b.bank_name))){
      const lines = ctx.lines[s.id] || [];
      const r = recon(s, lines);
      const row = el("div", "row clickable");
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      const l = el("div", "grow ell");
      l.append(el("span", null, "　" + s.bank_name));
      l.append(el("span", "muted", `　${lines.length} 筆`));
      row.append(l);
      row.append(statusNode(r));
      const open = () => openDetail(s.id);
      row.addEventListener("click", open);
      row.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      box.append(row);
    }
  }
}

// ── 逐筆原文 ─────────────────────────────────────────────────────────
function openDetail(sid){
  const s = ctx.statements.find(x => x.id === sid);
  const lines = ctx.lines[sid] || [];
  const r = recon(s, lines);
  $("detTitle").textContent = `${s.bank_name}　${s.period}`;
  const bits = [];
  if (s.stmt_date) bits.push("結帳日 " + s.stmt_date);
  if (s.due_date) bits.push("繳款截止 " + s.due_date);
  if (s.new_spend != null) bits.push("本期新增 " + fmt(s.new_spend));
  if (s.total_due != null) bits.push("本期應繳 " + fmt(s.total_due));
  if (s.prev_balance != null) bits.push("上期 " + fmt(s.prev_balance));
  if (s.payments != null) bits.push("已繳 " + fmt(s.payments));
  if (r.kind === "ok") bits.push("✓ 逐筆與帳單相符");
  else if (r.kind === "bad" && r.diff != null)
    bits.push(`⚠ 逐筆 ${fmt(r.sum)} vs ${r.basis} ${fmt(r.base)}，差 ${fmt(r.diff)}`);
  else if (r.kind === "bad") bits.push("⚠ 有帳號的期初＋收支對不上期末");
  if (r.accounts) for (const a of r.accounts)
    bits.push(`${a.acct || "帳號"}：期初 ${fmt(a.open)} → 期末 ${fmt(a.close)}${a.diff ? "（差 " + fmt(a.diff) + "）" : ""}`);
  bits.push("來源 " + (s.source === "ai" ? "AI 解析" : s.source === "generic" ? "通用解析" : "專屬解析器"));
  $("detHead").textContent = bits.join("　·　");
  const box = $("detLines"); clear(box);
  if (!lines.length) box.append(el("p", "muted", "此期無逐筆原文"));
  for (const l of lines){
    const row = el("div", "row");
    const left = el("div", "grow ell");
    left.append(el("div", null, l.description || "（無摘要）"));
    const sub = [l.txn_date || "", l.post_date && l.post_date !== l.txn_date ? "入帳 " + l.post_date : "",
                 l.account || ""].filter(Boolean).join(" · ");
    left.append(el("div", "muted", sub));
    row.append(left);
    const right = el("div", null);
    right.style.textAlign = "right";
    const amt = el("div", "num " + (Number(l.amount) < 0 ? "ok" : ""),
                   (Number(l.amount) < 0 ? "−" : "") + fmt(Math.abs(Number(l.amount))));
    right.append(amt);
    if (l.balance != null) right.append(el("div", "muted num", "餘 " + fmt(l.balance)));
    row.append(right);
    box.append(row);
  }
  $("viewInst").hidden = true; $("viewMonth").hidden = true; $("viewDetail").hidden = false;
}

async function pagedFetch(makeQuery){
  const out = []; const size = 1000; const maxPages = 30;
  for (let page = 0; page < maxPages; page++){
    const { data, error } = await makeQuery().range(page * size, page * size + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) return out;
  }
  // 跑滿上限且最後一頁仍是滿的＝資料被截斷。靜默截斷會讓對帳少算逐筆而顯示成假差額，
  // 寧可明白報錯（原本會無聲回傳不完整資料）。
  throw new Error(`資料超過 ${maxPages * size} 列，對帳會不完整——請回報以改為分批載入`);
}

async function afterLogin(session){
  $("whoami").textContent = session.user.email || "";
  $("btnSignOut").hidden = false;
  showStatus("讀取對帳簿…");
  try {
    // 排序鍵必須唯一，否則 OFFSET 分頁跨頁時 Postgres 不保證穩定＝重複或漏列（靜默算錯）
    const sts = await pagedFetch(() => sb.from("statements").select("*")
      .order("period", { ascending: false }).order("id"));
    if (!sts.length){ showError("查無對帳簿資料。請確認已在手機 App 登入同一個家庭，並跑過一次同步。"); return; }
    // line_no 只在單張帳單內唯一，全表看是大量重複值 → 必須配 statement_id 才穩定
    // （schema 有 uniq_stmt_line(statement_id, line_no) 唯一索引，此組合絕對唯一）。
    // 欄位白名單：raw 是每列完整 PDF 原文，目前 UI 不用，別讓它佔滿首屏頻寬。
    const lines = await pagedFetch(() => sb.from("statement_lines")
      .select("statement_id,line_no,txn_date,post_date,description,amount,account,balance")
      .order("statement_id").order("line_no"));
    ctx.statements = sts;
    ctx.lines = {};
    for (const l of lines) (ctx.lines[l.statement_id] ||= []).push(l);
    // 防禦性重排：對帳算法不該依賴查詢回來的順序
    for (const k in ctx.lines) ctx.lines[k].sort((a, b) => Number(a.line_no) - Number(b.line_no));
    renderInstitutions();
    renderMonths();
    showView("main");
  } catch (e){
    showError("讀取失敗：" + (e.message || e));
  }
}

function startLive(){
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  $("btnGoogle").addEventListener("click", async () => {
    $("loginErr").textContent = "";
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google", options: { redirectTo: location.origin + location.pathname } });
    if (error) $("loginErr").textContent = error.message;
  });
  $("btnSignOut").addEventListener("click", async () => { await sb.auth.signOut(); location.reload(); });
  let started = false;
  sb.auth.onAuthStateChange((_ev, s) => { if (s && !started){ started = true; afterLogin(s); } });
  sb.auth.getSession().then(({ data: { session } }) => {
    if (session){ if (!started){ started = true; afterLogin(session); } }
    else if (!started) showView("login");
  });
}

// ── ?selftest=1：對帳演算法自我測試（不連 Supabase、不需登入）────────────────
// 為什麼放在頁內而不是另寫測試檔：recon() 是這頁唯一會「算錯而不報錯」的地方
// （少加一列＝顯示假差額，多加一列＝把不符顯示成相符），但它活在 inline script 裡。
// 複製一份到測試檔＝兩份會走偏；就地自測＝永遠測到真正上線的那一份。
// 部署後隨時可用：billbook.html?selftest=1。
const SELFTESTS = [
  ["信用卡：逐筆合計＝本期新增 → 相符",
   { lines_scope: "purchases", new_spend: 300, total_due: 999 },
   [{ line_no: 1, amount: 100 }, { line_no: 2, amount: 200 }],
   r => r.kind === "ok" && r.sum === 300 && r.basis === "本期新增"],
  ["信用卡：差 1 元也要抓出來",
   { lines_scope: "purchases", new_spend: 301 },
   [{ line_no: 1, amount: 300 }], r => r.kind === "bad" && r.diff === -1],
  ["信用卡：沒有本期新增欄 → 退回本期應繳並標示基準",
   { lines_scope: "purchases", new_spend: null, total_due: 500 },
   [{ line_no: 1, amount: 500 }], r => r.kind === "ok" && r.basis.startsWith("本期應繳")],
  ["信用卡：只有帳單頭（無逐筆）不算對不上",
   { lines_scope: "purchases", new_spend: 500 }, [], r => r.kind === "none"],
  ["信用卡：帳單沒印總額 → 無法對帳，不可報成不符",
   { lines_scope: "purchases", new_spend: null, total_due: null },
   [{ line_no: 1, amount: 1 }], r => r.kind === "none"],
  ["流水：期初＋收支＝期末",
   { lines_scope: "ledger" },
   [{ line_no: 1, amount: 100, balance: 1100, account: "A" },
    { line_no: 2, amount: -300, balance: 800, account: "A" }],
   r => r.kind === "ok" && r.accounts[0].open === 1000 && r.accounts[0].close === 800],
  ["流水：中間有無餘額的列，金額仍要計入（否則變假差額）",
   { lines_scope: "ledger" },
   [{ line_no: 1, amount: 100, balance: 1100, account: "A" },
    { line_no: 2, amount: -50, balance: null, account: "A" },
    { line_no: 3, amount: -250, balance: 800, account: "A" }],
   r => r.kind === "ok"],
  ["流水：只有一列有餘額 → 判定不足，不可假陽性相符",
   { lines_scope: "ledger" },
   [{ line_no: 1, amount: 100, balance: 1100, account: "A" }],
   r => r.kind === "none" && r.accounts[0].insufficient === true],
  ["流水：兩個帳號分開算，其中一個對不上就整張不符",
   { lines_scope: "ledger" },
   [{ line_no: 1, amount: 100, balance: 1100, account: "A" },
    { line_no: 2, amount: -100, balance: 1000, account: "A" },
    { line_no: 3, amount: 50, balance: 550, account: "B" },
    { line_no: 4, amount: 50, balance: 999, account: "B" }],
   r => r.kind === "bad" && r.accounts.length === 2],
  ["流水：查詢回來的順序被打亂也要算對（不依賴排序）",
   { lines_scope: "ledger" },
   [{ line_no: 2, amount: -300, balance: 800, account: "A" },
    { line_no: 1, amount: 100, balance: 1100, account: "A" }],
   r => r.kind === "ok" && r.accounts[0].open === 1000],
  ["純餘額型：只陳列，不宣稱相符",
   { lines_scope: "balances" }, [{ line_no: 1, amount: 0 }], r => r.kind === "none"],
];

function runSelfTest(){
  const box = el("div", "card");
  let pass = 0, fail = 0;
  for (const [name, st, lines, check] of SELFTESTS){
    let ok = false, err = "";
    try { ok = !!check(recon(st, lines)); }
    catch (e){ err = " — 例外：" + (e.message || e); }
    ok ? pass++ : fail++;
    const row = el("div", "row");
    row.appendChild(el("span", "grow", name + err));
    row.appendChild(el("span", ok ? "ok" : "bad", ok ? "PASS" : "FAIL"));
    box.appendChild(row);
  }
  const head = el("h2", null, `對帳演算法自我測試：${pass} 通過、${fail} 失敗`);
  box.insertBefore(head, box.firstChild);
  const wrap = $("status");
  clear(wrap); wrap.appendChild(box); wrap.className = "";
  showView("status");
  document.title = (fail ? "❌" : "✅") + " 對帳自測";
}

document.addEventListener("DOMContentLoaded", () => {
  if (new URLSearchParams(location.search).get("selftest") === "1"){
    runSelfTest();
    return;                      // 不連 Supabase、不載外部程式庫
  }
  bindNav();
  showStatus("載入中…");
  const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.53.0/dist/umd/supabase.min.js";
  s.integrity = "sha384-H9dj4GG/hgfwNjlYa740FF9geXbzyXSgepgoobvIAW49UUAcfk+GAiBnLDIs4hRh";
  s.crossOrigin = "anonymous";
  s.onload = startLive;
  s.onerror = () => showError("無法載入 Supabase 程式庫，請檢查網路連線。");
  document.head.appendChild(s);
});
</script>
